<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CABINDA BUSINESS</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
header{background:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
h1{color:#667eea;margin:0}
#carrinho-btn{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;padding:15px 20px;border-radius:50px;border:none;font-size:16px;font-weight:bold}
.container{max-width:1000px;margin:20px auto;padding:10px}
.produtos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#fff;border-radius:15px;padding:15px;text-align:center}
.card img{width:100%;height:200px;object-fit:cover;border-radius:10px}
.preco{color:#25D366;font-size:20px;font-weight:bold}
.btn-add{background:#667eea;color:#fff;padding:10px 15px;border:none;border-radius:20px;cursor:pointer;font-weight:bold}
footer{text-align:center;padding:20px;color:#fff}
</style>
</head>
<body>
<header><h1>CABINDA BUSINESS</h1><p>Entrega em Luanda e Cabinda</p></header>
<div class="container"><div class="produtos">
  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Relógio">
    <h3>Relógio</h3>
    <p class="preco">AOA 30.000</p>
    <button class="btn-add" onclick="addCarrinho('Relógio', 30000)">Adicionar</button>
  </div>
</div></div>
<button id="carrinho-btn" onclick="enviarWhatsApp()">Ver Carrinho (0)</button>
<footer><p>© 2026 CABINDA BUSINESS - +244 972 370 499</p></footer>
<script>
let carrinho = [];let total = 0;
function addCarrinho(nome, preco){carrinho.push({nome, preco});total += preco;document.getElementById('carrinho-btn').innerText = `Ver Carrinho (${carrinho.length})`;alert(nome + ' adicionado!');}
function enviarWhatsApp(){if(carrinho.length == 0){ alert('Carrinho vazio!'); return; }let mensagem = 'Olá CABINDA BUSINESS! Quero pedir:%0A%0A';carrinho.forEach(item => {mensagem += `- ${item.nome}: AOA ${item.preco.toLocaleString()}%0A`;});mensagem += `%0A Total: AOA ${total.toLocaleString()}`;window.open(`https://wa.me/244972370499?text=${mensagem}`);}
</script>
</body>
</html>
